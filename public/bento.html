/* ---------- Planning d'un enfant : grille horaire ----------
   La liste par jour a été abandonnée : elle disait « quoi » mais pas « quand » ni
   « combien de temps ». Ici la hauteur d'un bloc est sa durée, les trous se voient,
   et une journée chargée se reconnaît sans lire les horaires. */
const PALETTE_PLAN=['#f0902f','#6b8fc9','#f7d548','#22c3d0','#bcd230','#a96fbb',
                    '#f4a6cd','#7fd1a4','#ef8181','#8fb2e8','#d9a441','#5fc8a0',
                    '#c78fd6','#e8756f','#9ec94a','#6fc3d8'];
const hachage=s=>{let h=0;const n=String(s||'').trim().toUpperCase();
  for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return h;};

/* Couleurs de tout le planning d'un coup : le hachage seul donnait la même teinte à des
   matières différentes, ce qui annule l'intérêt de la couleur. On garde le hachage comme
   premier choix (c'est lui qui rend la teinte stable d'une semaine sur l'autre) puis on
   décale vers la première libre. */
function couleursPlan(cr){
  const noms=[...new Set(cr.map(c=>String(c.quoi||'').trim()))].sort();
  const pris=new Set(),out=new Map();
  for(const n of noms){
    const fixe=(cr.find(c=>c.quoi===n&&c.couleur)||{}).couleur;
    if(fixe){out.set(n,fixe);pris.add(fixe);continue;}
    let i=hachage(n)%PALETTE_PLAN.length;
    for(let k=0;k<PALETTE_PLAN.length&&pris.has(PALETTE_PLAN[i]);k++)i=(i+1)%PALETTE_PLAN.length;
    out.set(n,PALETTE_PLAN[i]);pris.add(PALETTE_PLAN[i]);
  }
  return out;
}

const minDe=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(String(t||''));return m?+m[1]*60+ +m[2]:null;};
const hmDe=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');

/* Deux créneaux à la même heure se partagent la largeur : sans ça l'un masque l'autre
   et on le croit perdu (cas réel : piscine pendant l'option facultative). */
function disposerPlan(list){
  const tri=list.slice().sort((a,b)=>a.deb-b.deb||a.fin-b.fin);
  const out=[],grappe=[];let finMax=-1;
  const vider=()=>{
    const cols=[];
    for(const c of grappe){
      let k=cols.findIndex(f=>f<=c.deb);
      if(k<0){k=cols.length;cols.push(0);}
      cols[k]=c.fin;c.col=k;
    }
    for(const c of grappe){c.nbCol=cols.length;out.push(c);}
    grappe.length=0;
  };
  for(const c of tri){
    if(grappe.length&&c.deb>=finMax)vider();
    grappe.push(c);finMax=Math.max(finMax,c.fin);
  }
  if(grappe.length)vider();
  return out;
}

const PX_MIN_PLAN=1.15,DUREE_DEFAUT_PLAN=55;

function vuePlanning(p){
  const ti=todayIdx();
  /* Tous les créneaux à plat, en gardant leur jour : il faut une échelle de temps
     COMMUNE à la semaine, sinon les colonnes ne s'alignent plus. */
  const tous=[],sansH=[];
  for(const d of DAYS)for(const c of (p.semaine&&p.semaine[d])||[]){
    const deb=minDe(c.h);
    if(deb===null){sansH.push({...c,jour:d});continue;}
    const f=minDe(c.fin);
    tous.push({...c,jour:d,deb,fin:(f!==null&&f>deb)?f:deb+DUREE_DEFAUT_PLAN});
  }
  if(!tous.length&&!sansH.length)
    return '<div class="vide" style="padding:26px 0;text-align:center">Aucun créneau.</div>';

  /* Samedi et dimanche n'apparaissent que s'ils servent : deux colonnes vides en
     permanence volent de la largeur aux jours de classe. */
  const jours=DAYS.filter(d=>['Lun','Mar','Mer','Jeu','Ven'].includes(d)
    ||tous.some(c=>c.jour===d)||sansH.some(c=>c.jour===d));

  const COUL=couleursPlan(tous.concat(sansH));
  const coul=c=>COUL.get(String(c.quoi||'').trim())||PALETTE_PLAN[0];

  const dep=tous.length?Math.floor(Math.min(...tous.map(c=>c.deb))/60)*60:8*60;
  const arr=tous.length?Math.ceil(Math.max(...tous.map(c=>c.fin))/60)*60:18*60;
  const H=Math.max(220,(arr-dep)*PX_MIN_PLAN);
  const y=m=>(m-dep)*PX_MIN_PLAN;

  let lignes='',heures='';
  for(let m=dep;m<=arr;m+=30)lignes+=`<div class="ln ${m%60?'lnd':''}" style="top:${y(m)}px"></div>`;
  for(let m=dep;m<=arr;m+=60)heures+=`<div class="hl" style="top:${y(m)}px">${Math.floor(m/60)}h</div>`;

  const colonne=d=>{
    const blocs=disposerPlan(tous.filter(c=>c.jour===d)).map(c=>{
      const haut=(c.fin-c.deb)*PX_MIN_PLAN,larg=100/c.nbCol;
      return `<div class="pbloc ${c.categorie==='activite'?'act':''} ${haut<36?'pcourt':''}"
        style="top:${y(c.deb)}px;height:${haut-2}px;left:calc(${c.col*larg}% + 2px);
               width:calc(${larg}% - 4px);--pc:${esc(coul(c))}">
        <div class="pn">${esc(c.quoi)}</div>
        <div class="ph">${esc(hmDe(c.deb))} – ${esc(hmDe(c.fin))}</div>
        ${haut>=62&&(c.salle||c.ou)?`<div class="pd">${esc(c.salle||c.ou)}</div>`:''}
      </div>`;
    }).join('');
    const auj=DAYS.indexOf(d)===ti;
    return `<div class="pcol ${auj?'today':''}" style="height:${H}px">${lignes}${blocs}</div>`;
  };

  const vues=new Map();
  for(const c of tous.concat(sansH))if(!vues.has(c.quoi))vues.set(c.quoi,coul(c));

  return `
  ${sansH.length?`<div style="margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px">
    ${sansH.map(c=>`<span class="plegende" style="margin:0"><span style="background:${esc(coul(c))}">
      ${esc(c.jour)} · ${esc(c.quoi)}</span></span>`).join('')}</div>`:''}
  <div class="pgrille" style="grid-template-columns:48px repeat(${jours.length},minmax(0,1fr))">
    <div class="pjour" style="background:transparent"></div>
    ${jours.map(d=>`<div class="pjour ${DAYS.indexOf(d)===ti?'today':''}">${esc(d)}</div>`).join('')}
    <div class="pgut" style="height:${H}px">${heures}</div>
    ${jours.map(colonne).join('')}
  </div>
  <div class="plegende">${[...vues].map(([n,c])=>
    `<span style="background:${esc(c)}">${esc(n)}</span>`).join('')}</div>`;
}

/* ---------- agenda : vues jour / semaine / mois ---------- */
let agVue='semaine',agRef=new Date();
function ouvreAgendaSur(jour){agVue='jour';agRef=new Date(jour+'T12:00');openTile('agenda');}
function agAller(pas){
  if(pas===0){agRef=new Date();return drawSheet('agenda');}
  const d=new Date(agRef);
  if(agVue==='jour')d.setDate(d.getDate()+pas);
  else if(agVue==='semaine')d.setDate(d.getDate()+7*pas);
  else d.setMonth(d.getMonth()+pas,1);
  agRef=d;drawSheet('agenda');
}
function agSetVue(v,jour){agVue=v;if(jour)agRef=new Date(jour);drawSheet('agenda');}

function vueAgenda(){
  const auj=new Date();
  let titre;
  if(agVue==='jour')titre=agRef.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  else if(agVue==='semaine'){const l=lundi(agRef),f=new Date(l);f.setDate(l.getDate()+6);
    titre=`${l.getDate()} ${moisCourt(l.getMonth())} – ${f.getDate()} ${MOIS[f.getMonth()]}`;}
  else titre=`${MOIS[agRef.getMonth()]} ${agRef.getFullYear()}`;

  let h=`<div class="agnav">
    <button onclick="agAller(-1)">${ico('left')}</button>
    <button onclick="agAller(0)">Aujourd'hui</button>
    <button onclick="agAller(1)">${ico('right')}</button>
    <span class="per">${titre}</span>
    <span class="vues">${['jour','semaine','mois'].map(v=>
      `<button class="${agVue===v?'on':''}" onclick="agSetVue('${v}')">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</span></div>`;

  if(agVue==='jour'){
    const ev=evtsDuJour(agRef),fr=ferieDe(agRef);
    if(fr)h+=`<div class="ferie">🇫🇷 ${esc(fr)} — jour férié</div>`;
    h+=ev.length?ev.map(ligneEvt).join(''):'<div class="vide" style="padding:20px 0">Rien de prévu ce jour-là</div>';
  }else if(agVue==='semaine'){
    const l=lundi(agRef);
    h+=DAYS.map((d,i)=>{
      const j=new Date(l);j.setDate(l.getDate()+i);
      const ev=evtsDuJour(j),fr=ferieDe(j);
      return `<div class="agj ${memeJour(j,auj)?'today':''} ${fr?'jferie':''}">
        <div class="jn">${JOURS_LONG[i]} <small>${j.getDate()} ${moisCourt(j.getMonth())}</small>
          ${fr?`<span class="tag ferie-tag">${esc(fr)}</span>`:''}</div>
        <div class="jl">${ev.length?ev.map(ligneEvt).join(''):'<span class="vide">—</span>'}</div></div>`;
    }).join('');
  }else{
    const debut=lundi(new Date(agRef.getFullYear(),agRef.getMonth(),1));
    h+='<div class="grille">'+DAYS.map(d=>`<div class="mh">${d}</div>`).join('');
    for(let i=0;i<42;i++){
      const j=new Date(debut);j.setDate(debut.getDate()+i);
      if(i>=35&&j.getMonth()!==agRef.getMonth())break;
      const ev=evtsDuJour(j),fr=ferieDe(j);
      h+=`<div class="gc ${j.getMonth()!==agRef.getMonth()?'out':''} ${memeJour(j,auj)?'today':''} ${fr?'jferie':''}"
        onclick="agSetVue('jour','${j.toISOString()}')" ${fr?`title="${esc(fr)}"`:''}><div class="n">${j.getDate()}</div>
        ${fr?`<div class="e ferie-tag">${esc(fr)}</div>`:''}
        ${ev.slice(0,fr?2:3).map(e=>`<div class="e">${e.journee?'':`<b>${hhmm(e.start)}</b> `}${esc(e.summary)}</div>`).join('')}
        ${ev.length>(fr?2:3)?`<div class="e">+${ev.length-(fr?2:3)}…</div>`:''}</div>`;
    }
    h+='</div>';
  }
  return h;
}

/* ---------- écritures ---------- */
async function addCourse(){
  const v=document.getElementById('cNew').value.trim();if(!v)return;
  try{await api('/api/course','POST',{article:v,rayon:document.getElementById('cRayon').value,
    who:document.getElementById('cWho').value});await refresh();}catch(e){showErr(e.message);}
}
async function addTodo(){
  const v=document.getElementById('tNew').value.trim();if(!v)return;
  try{await api('/api/todo','POST',{tache:v,who:document.getElementById('tWho').value,
    due:document.getElementById('tDue').value||undefined});await refresh();}catch(e){showErr(e.message);}
}
async function addPost(){
  const v=document.getElementById('pNew').value.trim();if(!v)return;
  try{await api('/api/postit','POST',{message:v,who:document.getElementById('pWho').value});await refresh();}
  catch(e){showErr(e.message);}
}
/* raw = "P:<plat>" (créé dans la bibliothèque si nouveau) ou "S:<spécial>" (texte libre seul) */
async function setMenu(id,champ,raw){
  const special=raw.startsWith('S:'),val=/^[PS]:/.test(raw)?raw.slice(2):raw;
  try{await api('/api/menu/'+id,'PATCH',{[champ]:val,special});await apresMenu();}catch(e){showErr(e.message);}
}

/* Après une écriture sur le menu : si on regarde une AUTRE semaine, `refresh()` ne
   suffit pas — il ne recharge que la semaine du jour et le panneau resterait figé
   sur l'ancienne valeur. */
async function apresMenu(){
  if(!MENU_SEM)return refresh();
  try{
    const r=await (await fetch('/api/menu?semaine='+MENU_SEM)).json();
    MENU_SEM_DATA=r.menu;
    await refresh();
  }catch(e){showErr(e.message);}
}

/* ---------- veille ---------- */
const saver=document.getElementById('saver');
function renderSaver(){
  const M=S.meteo;
  /* En veille aussi, l'anniversaire prime : c'est souvent le seul moment de la
     journée où quelqu'un regarde l'écran de loin. */
  const anv=(S.anniversaires&&S.anniversaires.aujourdhui)||[];
  document.getElementById('svSaint').textContent=anv.length
    ?('🎂 Anniversaire de '+anv.map(a=>a.nom+(a.age!=null?` (${a.age} ans)`:'')).join(', '))
    :(S.saint?('Fête du jour · '+S.saint):'');
  document.getElementById('svWx').innerHTML=M&&M.temp!=null
    ?`<div class="i2">${M.icone||''}</div><div><div class="t">${M.temp}°</div>
      <div class="d">${esc(M.texte)} · ${M.min}°/${M.max}°</div></div>`:'';

  const ev=evtsDuJour(new Date());
  const dernier=[...S.postits].sort((a,b)=>(b.pin?1:0)-(a.pin?1:0))[0];
  const co=S.courses.filter(x=>!x.pris).length,to=S.todos.filter(x=>!x.done).length;
  const repasSoir=S.menu.find(m=>(m.jour||'').startsWith(DAYS[todayIdx()]))||{};
  const soir=repasSoir.soir;

  document.getElementById('svGrid').innerHTML=`
    <div class="sv-w"><div class="wt">Aujourd'hui</div>${
      ev.length?ev.slice(0,4).map(e=>`<div class="row"><b>${heureEvt(e)}</b><span>${esc(e.summary)}</span></div>`).join('')
              :'<div class="wm">Rien de prévu</div>'}</div>
    <div class="sv-w"><div class="wt">Ce soir</div>
      <div class="wm">${esc(repasSoir.soirEmoji||picto(soir))} ${esc(soir)||'à définir'}</div>
      <div class="ws">${co} article(s) à acheter · ${to} tâche(s) à faire</div></div>
    <div class="sv-w"><div class="wt">Dernier mot</div>${
      dernier?`<div class="wm">${esc(dernier.message)}</div><div class="ws">— ${esc(dernier.who)}</div>`
             :'<div class="wm">Aucun mot</div>'}</div>`;

  majNews('svNews','svNewsVp');
}
function showSaver(){closeTile();renderSaver();saver.classList.add('on');}
saver.addEventListener('click',()=>{saver.classList.remove('on');resetIdle();});

/* Délai de veille réglable depuis /admin/ → Réglages (il était codé en dur à
   25 min, ce qui rendait le champ du back-office décoratif). */
let idle,veilleMs=25*60*1000;
function resetIdle(){clearTimeout(idle);idle=setTimeout(showSaver,veilleMs);}
['click','touchstart','keydown'].forEach(e=>
  document.addEventListener(e,()=>{if(!saver.classList.contains('on'))resetIdle();},{passive:true}));
resetIdle();

/* ---------- synchronisation temps réel ----------
   Le serveur pousse un événement dès qu'un téléphone ou l'écran modifie quelque chose :
   la coche faite dans l'app apparaît ici tout de suite, sans attendre un cycle.
   `EventSource` se reconnecte tout seul si le Wi-Fi tombe — rien à gérer à la main.
   Le rafraîchissement périodique reste, très espacé : il rattrape la météo, les actus
   et l'agenda (qui changent sans passer par nous), et sert de filet si le flux meurt. */
let majEnAttente;
function brancherFlux(){
  try{
    const flux=new EventSource('/api/flux');
    flux.addEventListener('maj',()=>{                    // rafale d'événements -> un seul rechargement
      clearTimeout(majEnAttente);majEnAttente=setTimeout(refresh,120);
    });
    flux.addEventListener('notif',(ev)=>{                // message à afficher, sans rechargement
      try{montrerNotif(JSON.parse(ev.data));}catch(e){}
    });
    flux.addEventListener('open',()=>console.log('flux temps réel connecté'));
  }catch(e){console.warn('flux indisponible, on reste sur le rafraîchissement périodique');}
}

/* ---------- Notifications ----------
   Envoyées depuis le back-office ou l'app, elles arrivent par le flux et s'affichent
   au même instant ici et sur les téléphones ouverts (~30 ms mesurés).
   ⚠️ Ce n'est PAS le push iOS : un téléphone verrouillé ne sonnera pas tant qu'on n'a
   pas de HTTPS (Tailscale + Mac mini). Ici, sur un écran mural allumé en permanence,
   ça suffit — c'est justement le cas d'usage. */
const ICONES_NIVEAU={info:'🔔',important:'⚠️',urgent:'🚨'};
let minuteurNotif;

function montrerNotif(n){
  const d=document.getElementById('notif');
  d.className='notif '+(n.niveau||'info');
  document.getElementById('notifIco').textContent=ICONES_NIVEAU[n.niveau]||'🔔';
  document.getElementById('notifTitre').textContent=n.titre||'';
  /* On dit POUR QUI : sur un écran partagé, « Amandine — RDV 18 h » évite que chacun
     se demande si le message le concerne. */
  const pour=n.pour?n.pour+' · ':'';
  document.getElementById('notifMsg').textContent=pour+(n.message||'');

  saver.classList.remove('on');   // réveille l'écran : une notification invisible ne sert à rien
  resetIdle();
  requestAnimationFrame(()=>d.classList.add('on'));

  /* Un message urgent reste plus longtemps ; on peut toujours le chasser au doigt. */
  clearTimeout(minuteurNotif);
  minuteurNotif=setTimeout(fermerNotif,(n.niveau==='urgent'?90:35)*1000);
}

function fermerNotif(){
  clearTimeout(minuteurNotif);
  document.getElementById('notif').classList.remove('on');
}

/* ---------- Jarvis sur l'écran mural ----------
   Le moteur vit dans `voix.js`, partagé avec /vocal.html : reconnaissance,
   synthèse et appel serveur ont chacun leurs pièges de navigateur, et deux
   copies auraient divergé au premier correctif.

   Ici, l'interface se résume à trois choses : un bouton dans le rail, l'écho
   dans le bandeau de notification EXISTANT (qui sait déjà réveiller l'écran de
   veille — exactement ce qu'on veut quand on parle à la cuisine), et rien
   d'autre. Pas de panneau, pas de réglages : ils sont sur /vocal.html.

   ⚠️ Le bouton reste CACHÉ si le micro ne peut pas s'ouvrir. Sur une tablette en
   http://192.168.x.x, le navigateur l'interdit : contexte non sécurisé. Il
   apparaîtra le jour où l'écran sera servi en localhost (Raspberry avec un
   mandataire local, ou dalle branchée sur le Mac) ou en HTTPS via Tailscale. */
let VOIX=null;

/* Applique les réglages du back-office au moteur déjà créé.
   ⚠️ Appelé à CHAQUE chargement, pas seulement au démarrage : sans ça, changer
   la voix dans /admin/ n'avait d'effet qu'après un rechargement complet de
   l'écran mural — qu'on ne fait jamais sur un mur. */
function appliquerReglagesVoix(){
  if(!VOIX)return;
  const rv=(S.reglages&&S.reglages.voix)||{};
  VOIX.reglerVoix({nom:rv.nom||'',debit:rv.debit||1,ton:rv.ton||1,
    eveil:rv.eveil||'jarvis',exigerEveil:rv.exigerEveil!==false});
}

function initVoix(){
  if(typeof Voix==='undefined')return;
  const d=Voix.disponible();
  if(!d.utilisable)return;                      // on ne montre rien plutôt qu'un bouton inerte
  let jeton='';try{jeton=localStorage.getItem('maison-jeton')||'';}catch(e){}

  /* Tout le paramétrage vient du back-office : voix, débit, tonalité, mot
     d'éveil. L'écran mural n'a AUCUN écran de configuration, et ne doit pas en
     avoir — on ne règle pas un objet posé sur un mur, on le règle depuis un
     ordinateur. */
  const rv=(S.reglages&&S.reglages.voix)||{};
  VOIX=Voix.creer({jeton,motEveil:rv.eveil||'jarvis',exigerEveil:rv.exigerEveil!==false,
    debit:rv.debit||1,ton:rv.ton||1,voix:rv.nom||'',sur:{
    etat(e){
      const b=document.getElementById('btnVoix');
      if(!b)return;
      b.classList.toggle('on',e.continu);
      b.style.opacity=e.ecoute?'1':(e.continu?'.85':'');
      b.title=e.continu?`À l'écoute — dis « ${VOIX.motEveil} »`:'Parler à la maison';
    },
    /* ⚠️ RIEN ne s'affiche tant que le mot d'éveil n'a pas été prononcé.
       La première version montrait chaque phrase entendue, transcriptions
       provisoires comprises : autrement dit, toute conversation de cuisine
       s'affichait sur le mur. Ça ressemblait à de la surveillance parce que
       c'en était — et ça contredisait le principe du projet, qui est justement
       que rien ne sort avant « Jarvis ».
       Le mot d'éveil est cherché SUR L'APPAREIL : ce qui est écarté ici n'est
       ni affiché, ni envoyé, ni conservé. */
    entendu(texte,info){
      if(!info.eveil)return;
      montrerNotif({titre:'🎙️ '+texte,message:'…',niveau:'info'});
    },
    repondu(d){
      montrerNotif({titre:d.texte,message:d.reponse,niveau:'info'});
      if(d.fait)refresh();                      // une action a modifié les données
    },
    erreur(m){montrerNotif({titre:'Voix',message:m,niveau:'important'});},
  }});

  const b=document.getElementById('btnVoix');
  if(b)b.style.display='';
}

/* Un seul bouton : il ouvre ou ferme l'écoute continue.
   ⚠️ AUCUN bandeau à l'allumage. La première version en affichait un (« à
   l'écoute… »), qui restait plusieurs dizaines de secondes sur le mur à chaque
   appui : autrement dit, l'écran annonçait qu'il écoutait — exactement l'effet
   « surveillance » qu'on cherche à éviter. L'état se lit sur le BOUTON lui-même
   (allumé, pastille qui pulse) ; le bandeau ne s'ouvre que lorsque « Jarvis »
   a réellement été prononcé. */
function basculeVoix(){
  if(!VOIX)return;
  VOIX.basculerContinu();
  resetIdle();
}

/* ⚠️ `load()` est asynchrone. La première version appelait `initVoix()` juste
   après, sans attendre : les réglages (voix, débit, ton, mot d'éveil) n'étaient
   pas encore chargés, et l'écran retombait sur la voix française par défaut —
   féminine sous Windows. D'où « j'ai réglé une voix masculine et j'entends une
   voix féminine ». On attend, et on ré-applique à chaque rechargement. */
load().then(()=>{ initVoix(); appliquerReglagesVoix(); });
brancherFlux();
setInterval(load,5*60*1000);   // filet de sécurité + météo / actus / agenda
</script>
